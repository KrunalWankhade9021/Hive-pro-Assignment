[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-risk-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pydantic>=2.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "groq>=0.11",
  "pyarrow>=16.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

# The installable package is the application code only. `eval`, `tests`, `data`
# and `scripts` are project directories, not distributable packages, so we
# declare `app` explicitly rather than relying on flat-layout auto-discovery
# (which errors when it finds multiple top-level directories).
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
